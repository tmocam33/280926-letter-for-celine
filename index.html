<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter For You</title>
  <style>
    body {
      background-color: #ffe6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    .envelope-wrapper {
      position: relative;
      cursor: pointer;
      width: 320px; 
      height: 240px;
    }
    .envelope {
      width: 100%;
      height: 100%;
      background-color: #ff8c8c;
      position: relative;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 3;
    }
    .envelope::before {
      content: '';
      position: absolute;
      border-right: 160px solid transparent;
      border-bottom: 120px solid #ff9999;
      border-left: 160px solid transparent;
      bottom: 0;
      z-index: 3;
    }
    .envelope::after {
      content: '';
      position: absolute;
      border-right: 160px solid #ff7a7a;
      border-bottom: 120px solid transparent;
      border-top: 120px solid transparent;
      right: 0;
      z-index: 3;
    }
    .envelope-left {
      position: absolute;
      border-left: 160px solid #ff7a7a;
      border-bottom: 120px solid transparent;
      border-top: 120px solid transparent;
      left: 0;
      z-index: 4;
      /* The bug was here! Removed the height property so the triangle forms perfectly */
    }
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 120px solid #ff8c8c;
      transform-origin: top;
      transition: transform 0.6s ease-in-out, z-index 0.2s;
      z-index: 5;
    }
    .letter {
      position: absolute;
      bottom: 5px;
      left: 5%;
      width: 90%;
      height: 90%;
      background-color: #fffaf0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out;
      z-index: 2;
      padding: 15px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .letter h1 {
      font-size: 18px;
      color: #d6336c;
      margin: 0;
    }
    .letter .photo {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 6px;
      border: 4px solid white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin: 8px 0;
    }
    .letter p {
      font-size: 11px;
      color: #333;
      line-height: 1.4;
      margin: 0;
    }
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .envelope-wrapper.open .letter {
      transform: translateY(-160px); 
      height: 320px; 
      z-index: 4;
    }
    .hint {
      position: absolute;
      bottom: -40px;
      width: 100%;
      text-align: center;
      color: #d6336c;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="envelope-wrapper" onclick="openAndPlay()">
    <div class="flap"></div>
    <div class="envelope-left"></div>
    <div class="envelope"></div>
    
    <div class="letter">
      <h1>Hey Beautiful ❤️</h1>
      <img src="us.jpg" alt="Us" class="photo">
      <p>I just wanted to make something small to remind you how much you mean to me. You're amazing.</p>
    </div>
    
    <div class="hint">Tap to open</div>
  </div>

  <script>
    function openAndPlay() {
      const wrapper = document.querySelector('.envelope-wrapper');
      wrapper.classList.toggle('open');
      
      const music = document.getElementById('bg-music');
      if (wrapper.classList.contains('open')) {
        music.play().catch(err => console.log("Audio play blocked until user interaction", err));
      } else {
        music.pause();
      }
    }
  </script>

</body>
</html>
